<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnPick Purchase</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --onpick-red: #C26765;
            --onpick-gold: #F2D785;
            --text: #111;
            --muted: #777;
            --line: #e9e9e9;
            --card: #fff;
            --bg: #fff;
            --shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 22px 20px 30px;
        }

        /* 로고 */
        .logo {
            display: flex;
            justify-content: center;
            margin: 6px 0 18px;
            text-decoration: none;
            font-size: 34px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: -0.5px;
        }

        .logo-on {
            color: var(--onpick-red);
        }

        .logo-pick {
            color: var(--onpick-gold);
        }

        /* 섹션 타이틀 */
        .section-title {
            font-size: 16px;
            font-weight: 800;
            margin: 14px 0 8px;
        }

        /* 카드 */
        .card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            background: var(--card);
            padding: 12px;
        }

        /* 배송지 카드 */
        .addr-name {
            font-weight: 800;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .addr-line {
            font-size: 13px;
            color: #222;
            line-height: 1.35;
        }

        .addr-detail-input {
            width: 100%;
            margin-top: 10px;
            padding: 10px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }

        .addr-detail-input::placeholder {
            color: #c9c9c9;
        }

        /* 주문상품 카드 */
        .order-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-top: 1px solid #f0f0f0;
        }

        .order-item:first-child {
            border-top: none;
            padding-top: 0;
        }

        .thumb {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            object-fit: cover;
            background: #f1f1f1;
            flex-shrink: 0;
        }

        .item-text {
            width: 100%;
            min-width: 0;
        }

        .brand {
            font-size: 12px;
            color: #777;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .item-name {
            font-size: 15px;
            font-weight: 900;
            margin: 0 0 6px;
            line-height: 1.2;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 10px;
        }

        .item-option {
            font-size: 12px;
            color: #999;
        }

        .item-price {
            font-size: 13px;
            font-weight: 800;
            color: #222;
            white-space: nowrap;
        }

        /* 할인/쿠폰 라인 */
        .coupon-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }

        .coupon-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 800;
        }

        .btn-change {
            border: none;
            background: var(--onpick-gold);
            color: #333;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
        }

        .discount-amount {
            font-size: 14px;
            font-weight: 900;
            color: #333;
            white-space: nowrap;
        }

        /* 총 주문금액 */
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
            font-size: 14px;
            font-weight: 900;
        }

        .total-row .total {
            color: var(--onpick-red);
            font-size: 15px;
            font-weight: 900;
            white-space: nowrap;
        }

        /* 구매하기 버튼 */
        .btn-buy {
            width: 100%;
            margin-top: 16px;
            border: none;
            background: var(--onpick-red);
            color: var(--onpick-gold);
            font-size: 17px;
            font-weight: 900;
            padding: 16px 0;
            cursor: pointer;
            border-radius: 0;
            transition: background-color .2s;
        }

        .btn-buy:hover {
            background: #a85553;
        }

        /* 쿠폰 오버레이 */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            justify-content: center;
            align-items: flex-start;
            padding-top: 90px;
            z-index: 1000;
        }

        .overlay.show {
            display: flex;
        }

        .coupon-panel {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 10px;
            padding: 18px 18px 22px;
            box-shadow: var(--shadow);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 900;
            margin: 0 0 12px;
        }

        .coupon-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .coupon-card {
            border: 1px solid #cfcfcf;
            border-radius: 0;
            padding: 14px 14px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .coupon-leftcol {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .coupon-rate {
            font-weight: 900;
            font-size: 16px;
            width: 40px;
            text-align: center;
        }

        .coupon-info {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.25;
            color: #222;
        }

        .coupon-date {
            font-size: 12px;
            color: #666;
            font-weight: 700;
            margin-top: 4px;
        }

        .btn-use {
            border: none;
            padding: 9px 14px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 0;
            min-width: 88px;
        }

        .btn-use.enabled {
            background: var(--onpick-red);
            color: #fff;
        }

        .btn-use.disabled {
            background: #cfcfcf;
            color: #f4d77b;
            cursor: not-allowed;
        }

        .panel-actions {
            margin-top: 14px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-close {
            border: 1px solid #ddd;
            background: #fff;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 6px;
        }

        /* 구매 완료 팝업 */
        .done-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            justify-content: center;
            align-items: center;
            z-index: 1100;
        }

        .done-overlay.show {
            display: flex;
        }

        .done-box {
            width: 280px;
            background: #fff;
            padding: 26px 18px 18px;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .done-msg {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 18px;
        }

        .btn-home {
            width: 140px;
            border: 1px solid #999;
            background: #fff;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="../home/home.html" class="logo">
            <span class="logo-on">On</span><span class="logo-pick">Pick</span>
        </a>

        <!-- 배송지 -->
        <div class="section-title">배송지</div>
        <div class="card" id="addressCard">
            <div class="addr-name" id="nickname">홍길동</div>
            <div class="addr-line" id="addressLine1">서울특별시 성북구 화랑로 13길 60</div>
            <div class="addr-line" id="addressLine2">(하월곡동, 동덕여자대학교) (02748)</div>
            <input class="addr-detail-input" id="addressDetail" placeholder="배송 메모를 입력하세요" />
        </div>

        <!-- 주문상품 -->
        <div class="section-title">주문상품</div>
        <div class="card" id="orderCard">
            <!-- JS로 렌더 -->
            <div id="orderItems"></div>

            <!-- 할인/쿠폰 -->
            <div class="coupon-row">
                <div class="coupon-left">
                    <div>할인/쿠폰</div>
                    <button class="btn-change" id="btnChangeCoupon" type="button">변경</button>
                </div>
                <div class="discount-amount" id="discountText">-0원</div>
            </div>

            <!-- 총 주문금액 -->
            <div class="total-row">
                <div>총 주문금액</div>
                <div class="total" id="totalText">0원</div>
            </div>
        </div>

        <button class="btn-buy" id="btnBuy">구매하기</button>
    </div>

    <!-- 쿠폰 선택 오버레이 -->
    <div class="overlay" id="couponOverlay">
        <div class="coupon-panel">
            <div class="panel-title">보유 쿠폰</div>

            <div class="coupon-list" id="couponList"></div>

            <div class="panel-actions">
                <button class="btn-close" id="btnCloseCoupon" type="button">닫기</button>
            </div>
        </div>
    </div>

    <!-- 구매 완료 팝업 -->
    <div class="done-overlay" id="doneOverlay">
        <div class="done-box">
            <div class="done-msg">구매가 완료 되었습니다!</div>
            <button class="btn-home" id="btnGoHome" type="button">홈으로</button>
        </div>
    </div>

    <script>
        /**
         * 데이터 흐름
         * - 장바구니에서 선택된 상품: localStorage "onpick_checkout_items"
         * - 유저 정보(닉네임/주소): 아직 백 연동 전이므로 localStorage로 가정
         *   - onpick_user_nickname
         *   - onpick_user_address1
         *   - onpick_user_address2
         */

        // -----------------------------
        // 1) 유저 정보 세팅 (fallback 포함)
        // -----------------------------
        const nicknameEl = document.getElementById("nickname");
        const address1El = document.getElementById("addressLine1");
        const address2El = document.getElementById("addressLine2");

        const storedNick = localStorage.getItem("onpick_user_nickname");
        const storedAddr1 = localStorage.getItem("onpick_user_address1");
        const storedAddr2 = localStorage.getItem("onpick_user_address2");

        if (storedNick) nicknameEl.textContent = storedNick;
        if (storedAddr1) address1El.textContent = storedAddr1;
        if (storedAddr2) address2El.textContent = storedAddr2;

        // -----------------------------
        // 2) 주문 상품 가져오기 (장바구니에서 넘어온 것)
        // -----------------------------
        function safeParse(json, fallback) {
            try { return JSON.parse(json); } catch { return fallback; }
        }

        const orderItemsEl = document.getElementById("orderItems");
        const discountTextEl = document.getElementById("discountText");
        const totalTextEl = document.getElementById("totalText");

        let orderItems = safeParse(localStorage.getItem("onpick_checkout_items"), []);

        // 혹시 purchase를 단독으로 켰을 때를 대비한 더미
        if (!Array.isArray(orderItems) || orderItems.length === 0) {
            orderItems = [
                {
                    id: "item-1",
                    name: "잘 익은 아보카도",
                    option: "180g내외 (중과)",
                    price: 12910,
                    qty: 1,
                    image: "../../static/image/avocado.png",
                    checked: true
                }
            ];
        }

        // -----------------------------
        // 3) 쿠폰 더미 (백 설계 전이라 프론트 가정)
        // -----------------------------
        // 사용 가능 조건(임시):
        // - "아보카도 2개 이상 구매 시" 같은 룰을 간단히 체크
        const coupons = [
            {
                id: "cp-avocado-10",
                rate: 10,
                title: "아보카도",
                rule: "2개 이상 구매시",
                from: "2025.12.17",
                to: "2025.12.31",
                // eligibility: "아보카도" 상품 qty 합이 2 이상이면 true
                isEligible: (items) => {
                    const q = items
                        .filter(i => (i.name || "").includes("아보카도"))
                        .reduce((s, i) => s + (i.qty || 0), 0);
                    return q >= 2;
                }
            },
            {
                id: "cp-avocado-10-2",
                rate: 10,
                title: "아보카도",
                rule: "2개 이상 구매시",
                from: "2025.12.17",
                to: "2025.12.31",
                // 두 번째 쿠폰은 예시로 '항상 비활성'처럼 보이게
                isEligible: () => false
            }
        ];

        let appliedCouponId = null;
        let discountAmount = 0;

        function formatKRW(num) {
            return (num || 0).toLocaleString("ko-KR") + " 원";
        }

        function calcSubtotal(items) {
            return items.reduce((sum, i) => sum + (i.price * i.qty), 0);
        }

        function calcDiscount(items) {
            if (!appliedCouponId) return 0;
            const cp = coupons.find(c => c.id === appliedCouponId);
            if (!cp) return 0;

            // 쿠폰 적용 가능 여부 체크
            if (!cp.isEligible(items)) return 0;

            // 할인 계산(임시): 전체 주문금액의 rate%
            const subtotal = calcSubtotal(items);
            return Math.floor(subtotal * (cp.rate / 100));
        }

        function renderOrderItems() {
            orderItemsEl.innerHTML = "";

            orderItems.forEach(item => {
                const row = document.createElement("div");
                row.className = "order-item";
                row.innerHTML = `
          <img class="thumb" src="${item.image || ""}" alt="${item.name || ""}" />
          <div class="item-text">
            <div class="brand">과일상점</div>
            <div class="item-name">${item.name}</div>
            <div class="meta-row">
              <div class="item-option">옵션: ${item.option || "-"}</div>
              <div class="item-price">가격: ${formatKRW(item.price)}</div>
            </div>
          </div>
        `;
                orderItemsEl.appendChild(row);
            });

            // 금액 반영
            const subtotal = calcSubtotal(orderItems);
            discountAmount = calcDiscount(orderItems);
            const finalTotal = Math.max(0, subtotal - discountAmount);

            discountTextEl.textContent = "-" + (discountAmount || 0).toLocaleString("ko-KR") + "원";
            totalTextEl.textContent = (finalTotal || 0).toLocaleString("ko-KR") + " 원";
        }

        // -----------------------------
        // 4) 쿠폰 오버레이 렌더 + 선택
        // -----------------------------
        const couponOverlay = document.getElementById("couponOverlay");
        const couponListEl = document.getElementById("couponList");
        const btnChangeCoupon = document.getElementById("btnChangeCoupon");
        const btnCloseCoupon = document.getElementById("btnCloseCoupon");

        function openCoupon() {
            renderCoupons();
            couponOverlay.classList.add("show");
        }
        function closeCoupon() {
            couponOverlay.classList.remove("show");
        }

        function renderCoupons() {
            couponListEl.innerHTML = "";

            coupons.forEach(cp => {
                const eligible = cp.isEligible(orderItems);

                const card = document.createElement("div");
                card.className = "coupon-card";
                card.innerHTML = `
          <div class="coupon-leftcol">
            <div class="coupon-rate">${cp.rate}%</div>
            <div>
              <div class="coupon-info">
                ${cp.title}<br/>
                ${cp.rule}
              </div>
              <div class="coupon-date">${cp.from}~${cp.to}</div>
            </div>
          </div>
          <button class="btn-use ${eligible ? "enabled" : "disabled"}"
                  data-id="${cp.id}"
                  ${eligible ? "" : "disabled"}>
            사용 가능
          </button>
        `;
                couponListEl.appendChild(card);
            });
        }

        couponListEl.addEventListener("click", (e) => {
            const btn = e.target.closest(".btn-use");
            if (!btn) return;
            if (btn.disabled) return;

            appliedCouponId = btn.dataset.id;

            // 쿠폰 선택 즉시 반영 + 닫기
            renderOrderItems();
            closeCoupon();
        });

        btnChangeCoupon.addEventListener("click", openCoupon);
        btnCloseCoupon.addEventListener("click", closeCoupon);

        // 배경 클릭 시 닫기
        couponOverlay.addEventListener("click", (e) => {
            if (e.target === couponOverlay) closeCoupon();
        });

        // -----------------------------
        // 5) 구매하기 -> 구매 완료 팝업 -> 홈 이동
        // -----------------------------
        const doneOverlay = document.getElementById("doneOverlay");
        const btnBuy = document.getElementById("btnBuy");
        const btnGoHome = document.getElementById("btnGoHome");

        btnBuy.addEventListener("click", () => {
            // 여기서 나중에 결제 API 호출/주문 생성 API 호출로 교체하면 됨
            doneOverlay.classList.add("show");
        });

        btnGoHome.addEventListener("click", () => {
            // 결제 완료 후 장바구니/체크아웃 데이터 정리(원하면 유지해도 됨)
            localStorage.removeItem("onpick_checkout_items");
            location.href = "../home/home.html";
        });

        // ESC로 닫기(선택)
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                couponOverlay.classList.remove("show");
            }
        });

        // 첫 렌더
        renderOrderItems();
    </script>
</body>

</html>
