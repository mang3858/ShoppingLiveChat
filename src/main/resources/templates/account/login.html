<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnPick Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        /* 기본 스타일 초기화 및 폰트 설정 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center; /* 가로 중앙 정렬 */
            align-items: center;     /* 세로 중앙 정렬 */
            height: 100vh;           /* 화면 전체 높이 사용 */
            margin: 0;
        }

        .login-wrapper {
            width: 300px; /* 전체 컨테이너 너비 */
            text-align: center;
            padding: 20px;
        }

        /* 1. 로고 (OnPick) 스타일 */
        .logo {
            font-size: 36px;
            font-weight: 800;
            text-decoration: none; /* 밑줄 제거 */
            margin-bottom: 30px;
            display: inline-block;
            font-style: italic; /* 약간 기울임 (이미지 느낌) */
        }
        .logo-on { color: #C26765; } /* On 색상 (붉은 갈색) */
        .logo-pick { color: #F2D785; } /* Pick 색상 (베이지/골드) */

        /* Login 제목 */
        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* 2. 입력창 (Email, PW) 스타일 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px; /* 입력창 사이 간격 */
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #999; /* 테두리 색상 */
            box-sizing: border-box; /* 패딩 포함 너비 계산 */
            font-size: 14px;
        }

        input::placeholder {
            color: #ccc;
        }

        /* 3. 붉은색 로그인 버튼 스타일 */
        .btn-login {
            background-color: #C26765; /* 로고와 유사한 붉은색 */
            color: #F2D785;
            border: none;
            padding: 10px 40px; /* 상하 10px, 좌우 40px */
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .btn-login:hover {
            background-color: #a85553; /* 마우스 올렸을 때 약간 진하게 */
        }

        /* 카카오 라벨 */
        .kakao-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
        }

        /* 4. 카카오 로그인 버튼 스타일 */
        .btn-kakao {
            width: 100%;
            background-color: #FEE500; /* 카카오 공식 노란색 */
            color: #191919; /* 카카오 공식 텍스트 색상 */
            border: none;
            border-radius: 6px; /* 모서리 둥글게 */
            padding: 12px 0;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; /* 아이콘과 텍스트 사이 간격 */
        }

        .kakao-icon {
            width: 20px;
            height: 20px;
            /* 실제 이미지가 있다면 아래 background 속성을 사용하거나 img 태그로 교체 */
        }

        /* 구분선 스타일 */
        .divider {
            border: 0;
            height: 1px;
            background: #ddd;
            margin: 30px 0 20px 0;
        }

        /* 5. 하단 SignUp 영역 */
        .footer {
            margin-top: 20px;
        }

        .footer p {
            margin: 0;
            font-size: 14px;
            color: #333;
        }

        .btn-signup {
            display: inline-block;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <a href="../home/home.html" class="logo"> <!--<a href="/" class="logo">로 변경하기-->
        <span class="logo-on">On</span><span class="logo-pick">Pick</span>
    </a>

    <h2>Login</h2>

    <form action="/login" method="post">
        <div class="input-group">
            <input type="email" name="username" placeholder="이메일을 입력하세요" required>
            <input type="password" name="password" placeholder="PW를 입력하세요" required>
        </div>

        <button type="submit" class="btn-login">로그인</button>
    </form>

    <div class="kakao-label">카카오 계정으로 간편 로그인/회원가입</div>

    <button type="button" class="btn-kakao" onclick="location.href='/oauth2/authorization/kakao'">
        <svg class="kakao-icon" viewBox="0 0 24 24" fill="#000000">
            <path d="M12 3C5.373 3 0 7.086 0 12.128c0 3.298 2.27 6.223 5.716 7.84-.25.925-.904 3.367-.936 3.526-.05.234.086.37.336.213.208-.13 3.3-2.19 4.604-3.085.736.1 1.492.155 2.28.155 6.627 0 12-4.086 12-9.128S16.627 3 12 3z"/>
        </svg>
        카카오 로그인
    </button>

    <hr class="divider">

    <div class="footer">
        <p>혹시 회원이 아니신가요?</p>
        <a href="../account/signup.html" class="btn-signup">SignUp</a>
    </div>
</div>

</body>
</html>
